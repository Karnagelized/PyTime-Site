{% load static %}

<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
            {% block title %}
            {% endblock title %}
        </title>

        <!-- Bootstarp -->
        <link rel="stylesheet" href="{% static 'core/bootstrap/css/bootstrap.min.css' %}">
        
        <!-- CSS -->
        <link rel="stylesheet" href="{% static 'core/css/css.css' %}">
        
        <!-- Icons -->
        <link rel="icon" type="image/png" href="{% static 'icon/favicon-16x16.png' %}" sizes="16x16" />
        <link rel="icon" type="image/png" href="{% static 'icon/favicon-32x32.png' %}" sizes="32x32" />
        <link rel="icon" type="image/png" href="{% static 'icon/favicon-96x96.png' %}" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="{% static 'icon/favicon.svg' %}" />
        <link rel="shortcut icon" href="{% static 'icon/favicon.ico' %}" />
        <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icon/apple-touch-icon.png' %}" />
        <meta name="apple-mobile-web-app-title" content="PyTime" />

        <!-- Meta -->
        <meta name="description" content="PyTime - сообщество программистов: статьи о Python и не только, веб-разработка на Django, код-ревью и обзор IT-вакансий. Стань разработчиком с нуля или повыси уровень скиллов.">

        <!-- Manifest -->
        <link rel="manifest" href="{% static '/manifest.json' %}" />

        {% block extraHead %}
            <!-- Custom head page -->
        {% endblock %}

        <!-- JS scripts -->
        <script src="{% static 'core/js/core.js' %}"></script>
        <script src="{% static 'core/js/modalWindows.js' %}"></script>

        {% block ogTags %}
            <!-- Add OG Tags for page -->
        {% endblock %}
    </head>

    <body>
        <!-- Header -->
        <header class="header sticky-top">
            {% include './header/header.html' %}

            <!-- Separator line -->
            <hr class="content_separator">
        </header>

        <!-- Main container -->
        <div class="main_container">
            {% block main-container %}
            {% endblock %}
        </div>

        <!-- Separator line -->
        <hr class="base_content_separator">

        <!-- Footer -->
        <footer class="footer">
            {% include './footer/footer.html' %}
        </footer>

        <!-- JS for Bootstrap -->
        <script src="{% static 'core/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    </body>
</html>
