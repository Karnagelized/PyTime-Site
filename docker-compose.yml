services:
  database:
    image: postgres:16.9-alpine
    container_name: database
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pytime_core:
    build:
      context: ./PyTime_Project
    container_name: core
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      HOST: ${HOST}
      PORT: ${PORT}
      DB_NAME: ${DB_NAME}
      USER: ${USER}
      PASSWORD: ${PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      - database
    volumes:
      - static_volume:/pytime/staticfiles

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www/:/var/www/certbot
      - ./certbot/conf/:/etc/letsencrypt
      - static_volume:/static
    depends_on:
      - pytime_core
      - database

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    entrypoint: "/bin/sh -c"
    command: >
      trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --non-interactive --post-hook 'nginx -s reload';
        sleep 12h & wait $$!;
      done
    volumes:
      - ./certbot/www/:/var/www/certbot
      - ./certbot/conf/:/etc/letsencrypt
    depends_on:
      - database
      - pytime_core
      - nginx

volumes:
  postgres_data:
  static_volume:

networks:
  default:
    name: pytime_network
    driver: bridge