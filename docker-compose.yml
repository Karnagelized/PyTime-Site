services:
  database_prod:
    image: postgres:16.9-alpine
    container_name: database_prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME_PROD}
      POSTGRES_USER: ${DB_USER_PROD}
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
      POSTGRESQL_SHARED_BUFFERS: 64MB
      POSTGRESQL_EFFECTIVE_CACHE_SIZE: 192MB
    ports:
      - "${DB_PORT_PROD}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always
    mem_limit: 256M
    memswap_limit: 512M
    mem_reservation: 128M

  core:
    build:
      context: ./PyTime_Project
    container_name: core
    env_file:
      - .env
    ports:
      - 8080
    depends_on:
      - database_prod
    volumes:
      - static_volume:/pytime/staticfiles
      - media_volume:/pytime/media
    restart: always
    mem_limit: 512M
    memswap_limit: 1G
    mem_reservation: 128M

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
      - static_volume:/static
      - media_volume:/media
      - ./PyTime_Project/statistics:/pytime/statistics
    depends_on:
      - core
      - database_prod
    restart: always
    mem_limit: 128M
    memswap_limit: 256M
    mem_reservation: 64M

volumes:
  postgres_prod_data:
  static_volume:
  media_volume:

networks:
  default:
    name: pytime_network_prod
    driver: bridge
