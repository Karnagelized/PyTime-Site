events {}

http {
    # HTTP
    server {
        listen 80;
        server_name www.pytime.ru pytime.ru admin.pytime.ru dev.pytime.ru;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri $uri/ =404;
            default_type "text/plain";
            add_header Cache-Control "no-cache";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS сервер для редиректа www -> без www
    server {
        listen 443 ssl;
        server_name www.pytime.ru;

        ssl_certificate /etc/letsencrypt/live/pytime.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pytime.ru/privkey.pem;

        return 301 https://pytime.ru$request_uri;
    }

    # Основной HTTPS сервер
    server {
        listen 443 ssl;
        server_name pytime.ru;

        ssl_certificate /etc/letsencrypt/live/pytime.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pytime.ru/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src * data: 'unsafe-eval' 'unsafe-inline'" always;

        # Базовые настройки для всех locacion
        # Размер тела
        client_max_body_size 1m;

        location / {
            proxy_pass http://core:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://core:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Размер тела для Админки
            client_max_body_size 100m;
        }

        location ~ /\.git {
            deny all;
            return 403;
        }

        location /static/ {
            alias /static/;
            include /etc/nginx/mime.types;
        }

        location /media/ {
            alias /media/;
            include /etc/nginx/mime.types;
        }

        location /manifest.json {
            alias /pytime/statistics/manifest.json;
            add_header Content-Type application/json;
            expires 24h;
            access_log off;
        }

        location /robots.txt {
            alias /pytime/statistics/robots.txt;
            add_header Content-Type text/plain;
            expires 24h;
            access_log off;
        }

        location /sitemap.xml {
            alias /pytime/statistics/sitemap.xml;
            add_header Content-Type application/xml;
            expires 24h;
            access_log off;
        }
    }

    # Поддомены HTTPS сервера
    server {
        listen 443 ssl;
        server_name admin.pytime.ru dev.pytime.ru;

        ssl_certificate /etc/letsencrypt/live/pytime.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pytime.ru/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src * data: 'unsafe-eval' 'unsafe-inline'" always;

        location / {
            proxy_pass http://core:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ /\.git {
            deny all;
            return 403;
        }

        location /static/ {
            alias /static/;
            include /etc/nginx/mime.types;
        }
    }
}